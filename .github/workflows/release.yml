# Every push to main builds the mod and the latest libfpv for 32-bit Windows
# and publishes portal-2-fpv.zip as a new GitHub release. The ZIP's contents
# go straight into the "Portal 2" folder; docs/INSTALL.md becomes the release
# page. Run it by hand (Actions > Release > Run workflow) to pick up a new
# libfpv.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: portal-2-fpv

      - uses: actions/checkout@v4
        with:
          repository: hammerill/libfpv
          path: libfpv
          # Top level only: SimITL's own nested submodules use SSH URLs, and
          # libfpv builds from its flattened copies in third_party/ instead.
          submodules: true

      - name: Install the i686 MinGW-w64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686-posix g++-mingw-w64-i686-posix zip

      - name: Build libfpv (i686)
        run: |
          cmake -S libfpv -B libfpv/build/win32 \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/libfpv/cmake/toolchains/mingw-w64-i686.cmake" \
            -DLIBFPV_BUILD_TESTS=OFF -DLIBFPV_BUILD_EXAMPLES=OFF
          cmake --build libfpv/build/win32 -j"$(nproc)"

      - name: Build the mod
        run: |
          cmake -S portal-2-fpv -B portal-2-fpv/build \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/portal-2-fpv/cmake/mingw-w64-i686.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBFPV_DIR="$GITHUB_WORKSPACE/libfpv"
          cmake --build portal-2-fpv/build -j"$(nproc)"

      # The ZIP mirrors the "Portal 2" folder (the one with portal2.exe):
      #   portal2/addons/portal2-fpv.vdf          Portal 2 loads the plugin from it
      #   portal2/addons/portal2-fpv/             the plugin, the core, libfpv
      #   portal2/models/fpv, materials/models/fpv  the drone's model (committed)
      # Settings live in %APPDATA%\libfpv, so extracting over an old build keeps them.
      - name: Package
        run: |
          pkg=dist/pkg/portal2
          mkdir -p "$pkg/addons/portal2-fpv"
          cp portal-2-fpv/addons/portal2-fpv.vdf "$pkg/addons/"
          cp portal-2-fpv/build/portal2-fpv.dll portal-2-fpv/build/core.dll \
             libfpv/build/win32/libfpv.dll "$pkg/addons/portal2-fpv/"
          cp libfpv/LICENSE "$pkg/addons/portal2-fpv/libfpv.LICENSE.txt"
          cp -r portal-2-fpv/content/. "$pkg/"
          (cd dist/pkg && zip -9r ../portal-2-fpv.zip portal2)
          unzip -l dist/portal-2-fpv.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mod_sha=$(git -C portal-2-fpv rev-parse HEAD)
          lib_sha=$(git -C libfpv rev-parse HEAD)
          {
            cat portal-2-fpv/docs/INSTALL.md
            echo
            echo "## This build"
            echo
            echo "- portal-2-fpv [\`${mod_sha:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${mod_sha}): $(git -C portal-2-fpv log -1 --format=%s)"
            echo "- libfpv [\`${lib_sha:0:7}\`](https://github.com/hammerill/libfpv/commit/${lib_sha}) (source of \`libfpv.dll\`, GPL-3.0-or-later)"
          } > dist/notes.md
          tag="build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/portal-2-fpv.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$mod_sha" \
            --title "Portal 2 FPV build ${GITHUB_RUN_NUMBER} ($(date -u +%Y-%m-%d))" \
            --notes-file dist/notes.md \
            --latest
